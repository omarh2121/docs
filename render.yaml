services:
  - type: web
    name: zyflex-ai
    rootDir: ./zyflex-ai
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TZ
        value: Europe/Copenhagen
      - key: CACHE_TTL
        value: "300"
