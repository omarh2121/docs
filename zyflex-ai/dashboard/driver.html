<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zyflex – Chauffør</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
    }

    /* Header */
    .header {
      background: #111;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }
    .logo { font-size: 17px; font-weight: 700; color: #1a73e8; }
    .clock { font-size: 14px; color: #888; font-weight: 500; }

    /* Main instruction card */
    .main-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .event-banner {
      background: rgba(245, 197, 24, 0.12);
      border: 1px solid rgba(245, 197, 24, 0.3);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      color: #f5c518;
      margin-bottom: 20px;
      max-width: 320px;
      display: none;
    }
    .event-banner.show { display: block; }

    .kør-label {
      font-size: 11px;
      letter-spacing: 4px;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .zone-name {
      font-size: clamp(42px, 12vw, 64px);
      font-weight: 900;
      color: #f5c518;
      line-height: 1;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }

    .score-pill {
      display: inline-block;
      background: rgba(245, 197, 24, 0.15);
      border: 1px solid rgba(245, 197, 24, 0.3);
      color: #f5c518;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
    }

    .reason {
      font-size: 16px;
      color: #ccc;
      margin: 20px auto 0;
      max-width: 300px;
      line-height: 1.6;
    }

    .tip {
      font-size: 13px;
      color: #666;
      font-style: italic;
      max-width: 290px;
      margin: 12px auto 0;
    }

    /* Confidence bar */
    .conf-wrap { width: 100%; max-width: 280px; margin: 20px auto 0; }
    .conf-labels { display: flex; justify-content: space-between; font-size: 11px; color: #555; margin-bottom: 5px; }
    .conf-bg { background: #1e1e1e; border-radius: 4px; height: 5px; overflow: hidden; }
    .conf-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #1a73e8, #34a853);
      transition: width .7s ease;
    }

    /* Divider */
    .divider { width: 48px; height: 1px; background: #1e1e1e; margin: 24px auto; }

    /* Backup zone */
    .backup {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }
    .backup strong { color: #888; }

    /* Weather strip */
    .weather-strip {
      background: #111;
      border-top: 1px solid #1a1a1a;
      padding: 10px 24px;
      font-size: 13px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Bottom bar */
    .bottom-bar {
      background: #111;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1a1a1a;
    }
    .update-info { font-size: 11px; color: #444; }
    .refresh-btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .3px;
      transition: background .15s;
    }
    .refresh-btn:active { background: #1558b0; }

    /* Admin link */
    .admin-link {
      text-align: center;
      padding: 8px;
      background: #111;
      border-top: 1px solid #1a1a1a;
    }
    .admin-link a { font-size: 11px; color: #444; text-decoration: none; }
    .admin-link a:hover { color: #666; }

    /* Loading */
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #1e1e1e;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 40px auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ Zyflex</div>
  <div class="clock" id="driverClock">--:--</div>
</div>

<div class="main-card">
  <div id="eventBanner" class="event-banner">🎉 <span id="eventName"></span></div>

  <div class="kør-label">KØR TIL</div>
  <div class="zone-name" id="dZone"><div class="spinner"></div></div>
  <span class="score-pill" id="dScore" style="display:none"></span>

  <div class="reason" id="dReason"></div>
  <div class="tip" id="dTip"></div>

  <div class="conf-wrap" id="confWrap" style="display:none">
    <div class="conf-labels">
      <span>Systemsikkerhed</span>
      <span id="confPct">–</span>
    </div>
    <div class="conf-bg">
      <div class="conf-fill" id="confFill" style="width:0"></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="backup" id="dBackup"></div>
</div>

<div class="weather-strip" id="weatherStrip" style="display:none">
  <span id="weatherEmoji"></span>
  <span id="weatherText"></span>
</div>

<div class="bottom-bar">
  <div class="update-info" id="dUpdated">Opdaterer...</div>
  <button class="refresh-btn" onclick="fetchRec()">Opdater</button>
</div>

<div class="admin-link"><a href="/">← Admin oversigt</a></div>

<script>
  setInterval(() => {
    const el = document.getElementById('driverClock');
    if (el) el.textContent = new Date().toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
  }, 1000);

  async function fetchRec() {
    try {
      const res = await fetch('/api/recommendation');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      render(d);
    } catch (err) {
      document.getElementById('dZone').textContent = 'FEJL';
      document.getElementById('dReason').textContent = 'Kunne ikke hente data. Prøv igen.';
    }
  }

  function render(d) {
    document.getElementById('dZone').textContent = d.zone || '–';
    document.getElementById('dReason').textContent = d.reason || '';
    document.getElementById('dTip').textContent = d.tip || '';

    const scorePill = document.getElementById('dScore');
    scorePill.textContent = `Score ${d.score} · ${d.confidence}% sikkerhed`;
    scorePill.style.display = 'inline-block';

    const confWrap = document.getElementById('confWrap');
    confWrap.style.display = '';
    document.getElementById('confPct').textContent = d.confidence + '%';
    document.getElementById('confFill').style.width = d.confidence + '%';

    if (d.backup_zone) {
      document.getElementById('dBackup').innerHTML =
        `Alternativt: <strong>${d.backup_zone}</strong> (score ${d.backup_score || '–'})`;
    }

    const events = d.active_events || [];
    const banner = document.getElementById('eventBanner');
    if (events.length > 0) {
      document.getElementById('eventName').textContent = events[0].name;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }

    document.getElementById('dUpdated').textContent =
      'Opdateret: ' + new Date().toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
  }

  // Also fetch weather for the strip
  async function fetchWeather() {
    try {
      const res = await fetch('/api/dashboard');
      if (!res.ok) return;
      const d = await res.json();
      const w = d.weather;
      if (w && w.available !== false) {
        const strip = document.getElementById('weatherStrip');
        const icons = { 0:'☀️', 1:'⛅', 2:'⛅', 3:'☁️' };
        const icon = w.is_rain ? '🌧️' : w.is_snow ? '❄️' : icons[Math.floor(w.weather_code/10)] || '🌤️';
        document.getElementById('weatherEmoji').textContent = icon;
        document.getElementById('weatherText').textContent =
          `${w.temperature != null ? w.temperature + '°C' : ''} · ${w.description}${w.demand_boost > 1 ? ' · +' + Math.round((w.demand_boost-1)*100) + '% efterspørgsel' : ''}`;
        strip.style.display = '';
      }
    } catch (_) {}
  }

  fetchRec();
  fetchWeather();
  setInterval(fetchRec, 3 * 60 * 1000);
</script>
</body>
</html>
