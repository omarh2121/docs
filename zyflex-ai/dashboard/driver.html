<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Zyflex – Chauffør</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      background: #111;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e1e1e;
      flex-shrink: 0;
    }
    .logo { font-size: 17px; font-weight: 700; color: #1a73e8; letter-spacing: -0.3px; }
    .clock { font-size: 15px; color: #888; font-weight: 500; font-variant-numeric: tabular-nums; }

    .main-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px 20px;
      text-align: center;
    }

    .event-banner {
      background: rgba(245, 197, 24, 0.1);
      border: 1px solid rgba(245, 197, 24, 0.25);
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      color: #f5c518;
      margin-bottom: 22px;
      max-width: 320px;
      display: none;
      animation: fadeIn .3s ease;
    }
    .event-banner.show { display: block; }

    .kør-label {
      font-size: 10px;
      letter-spacing: 5px;
      color: #444;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .zone-name {
      font-size: clamp(44px, 13vw, 68px);
      font-weight: 900;
      color: #f5c518;
      line-height: 1;
      letter-spacing: -1px;
      animation: fadeIn .4s ease;
    }

    .score-pill {
      display: inline-block;
      background: rgba(245, 197, 24, 0.12);
      border: 1px solid rgba(245, 197, 24, 0.25);
      color: #b89010;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
      letter-spacing: .3px;
    }

    .reason {
      font-size: 16px;
      color: #bbb;
      margin: 20px auto 0;
      max-width: 300px;
      line-height: 1.6;
    }

    .tip {
      font-size: 13px;
      color: #555;
      font-style: italic;
      max-width: 290px;
      margin: 10px auto 0;
      line-height: 1.5;
    }

    .conf-wrap { width: 100%; max-width: 260px; margin: 20px auto 0; }
    .conf-labels { display: flex; justify-content: space-between; font-size: 11px; color: #444; margin-bottom: 6px; }
    .conf-bg { background: #1a1a1a; border-radius: 3px; height: 4px; overflow: hidden; }
    .conf-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #1a73e8, #34a853);
      transition: width .8s ease;
    }

    .divider { width: 40px; height: 1px; background: #1a1a1a; margin: 22px auto; }

    .backup { font-size: 13px; color: #444; }
    .backup strong { color: #666; }

    .weather-strip {
      background: #111;
      border-top: 1px solid #1a1a1a;
      padding: 10px 20px;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .weather-strip .rain-alert { color: #f5c518; font-weight: 500; }

    .bottom-bar {
      background: #111;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1a1a1a;
      flex-shrink: 0;
    }
    .update-info { font-size: 11px; color: #333; }
    .refresh-btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: .2px;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s, transform .1s;
    }
    .refresh-btn:active { background: #1557b0; transform: scale(0.97); }

    .admin-link { text-align: center; padding: 8px; background: #0d0d0d; }
    .admin-link a { font-size: 11px; color: #2a2a2a; text-decoration: none; }

    /* Loading state */
    .loading-zone {
      width: 36px; height: 36px;
      border: 3px solid #1a1a1a;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 4px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* Error state */
    .error-state { color: #555; font-size: 14px; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ Zyflex</div>
  <div class="clock" id="driverClock">--:--</div>
</div>

<div class="main-card">

  <div id="eventBanner" class="event-banner">🎉 <span id="eventName"></span></div>

  <div class="kør-label">KØR TIL</div>
  <div class="zone-name" id="dZone"><div class="loading-zone"></div></div>
  <span class="score-pill" id="dScore" style="display:none"></span>

  <div class="reason" id="dReason"></div>
  <div class="tip" id="dTip"></div>

  <div class="conf-wrap" id="confWrap" style="display:none">
    <div class="conf-labels">
      <span>Systemsikkerhed</span>
      <span id="confPct">–</span>
    </div>
    <div class="conf-bg">
      <div class="conf-fill" id="confFill" style="width:0"></div>
    </div>
  </div>

  <div class="divider"></div>
  <div class="backup" id="dBackup"></div>

</div>

<div class="weather-strip" id="weatherStrip" style="display:none">
  <span id="weatherEmoji"></span>
  <span id="weatherText"></span>
</div>

<div class="bottom-bar">
  <div class="update-info" id="dUpdated">Opdaterer...</div>
  <button class="refresh-btn" onclick="fetchRec()">↻ Opdater</button>
</div>

<div class="admin-link"><a href="/">← Admin oversigt</a></div>

<script>
  // Live clock
  function updateClock() {
    const el = document.getElementById('driverClock');
    if (el) el.textContent = new Date().toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Single API call — recommendation now includes weather + active_events
  async function fetchRec() {
    try {
      const res = await fetch('/api/recommendation');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      render(await res.json());
    } catch (err) {
      document.getElementById('dZone').innerHTML = '<span class="error-state">FEJL</span>';
      document.getElementById('dReason').textContent = 'Kunne ikke hente data – tjek forbindelsen og prøv igen.';
      document.getElementById('dScore').style.display = 'none';
    }
  }

  function render(d) {
    // Zone instruction
    document.getElementById('dZone').textContent = d.zone || '–';
    document.getElementById('dReason').textContent = d.reason || '';
    document.getElementById('dTip').textContent = d.tip || '';

    // Score pill
    const pill = document.getElementById('dScore');
    pill.textContent = `Score ${d.score} · ${d.confidence}% sikkerhed`;
    pill.style.display = 'inline-block';

    // Confidence bar
    document.getElementById('confWrap').style.display = '';
    document.getElementById('confPct').textContent = (d.confidence || 0) + '%';
    document.getElementById('confFill').style.width = (d.confidence || 0) + '%';

    // Backup zone
    const backup = document.getElementById('dBackup');
    if (d.backup_zone) {
      backup.innerHTML = `Alternativt: <strong>${d.backup_zone}</strong>`;
    } else {
      backup.textContent = '';
    }

    // Active event banner
    const events = d.active_events || [];
    const banner = document.getElementById('eventBanner');
    if (events.length > 0) {
      document.getElementById('eventName').textContent = events[0].name;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }

    // Weather strip (included in recommendation response)
    const w = d.weather;
    if (w && w.available !== false && w.temperature != null) {
      const icon = w.is_rain ? '🌧️' : w.is_snow ? '❄️' : w.weather_code === 0 ? '☀️' : w.weather_code <= 3 ? '⛅' : '🌤️';
      const boost = w.demand_boost > 1.0 ? ` <span class="rain-alert">· +${Math.round((w.demand_boost - 1) * 100)}% efterspørgsel</span>` : '';
      document.getElementById('weatherEmoji').textContent = icon;
      document.getElementById('weatherText').innerHTML = `${w.temperature}°C · ${w.description}${boost}`;
      document.getElementById('weatherStrip').style.display = '';
    }

    document.getElementById('dUpdated').textContent =
      'Sidst opdateret: ' + new Date().toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
  }

  // Initial load + auto-refresh every 3 minutes
  fetchRec();
  setInterval(fetchRec, 3 * 60 * 1000);
</script>
</body>
</html>
