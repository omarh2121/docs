services:
  - type: web
    name: zyflex-ai
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: zyflex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: TZ
        value: Europe/Copenhagen
      - key: CACHE_TTL
        value: "300"
      - key: FEEDBACK_DATA_PATH
        value: /var/data/feedback.jsonl
      - key: DEMAND_LOG_PATH
        value: /var/data/demand_research.jsonl
      - key: CONTRACTS_LOG_PATH
        value: /var/data/contracts_log.jsonl
